<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascritp + DOM: Key event detect</title>
    <style>
        #tecla{
            color: orange;
            font-size: 32px;
        }
        #caracter{
            color: blue;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1>Javascritp + DOM: Key event detect</h1>
    <main>
        <h2>JS Key detect</h2>

        <h3 id="tecla">0</h3>

        <h4 id="caracter">A</h4>
    </main>
    <script>
        const tecla =document.getElementById('tecla') //Ya tenemos acceso al elemento y lo convierte a un objeto

        const caracter = document.getElementById('caracter')
        //console.log({tecla}) //textContent
        //console.log(tecla.textContent)
        //console.log({caracter})
        //console.log(caracter.textContent)

        // tecla.textContent=999 // escribir sobre los atributos html

        document.addEventListener('keydown',function(event){
            console.log('presionaste una tecla')

            console.log({event})
            console.log(event.key) // la letra presionada
            console.log(event.keyCode) // el codigo ascii


            tecla.textContent = event.keyCode
            caracter.textContent = event.key

        })

    </script>
</body>
</html>
